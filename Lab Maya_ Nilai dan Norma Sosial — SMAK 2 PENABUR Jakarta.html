/* ===== LOADING ===== */
#loading{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; color:#fff; text-align:center;}
.spinner{width:64px;height:64px;border:6px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px;}
@keyframes spin{to{transform:rotate(360deg);}}
.pbar{width:300px;height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:14px;border:1px solid rgba(255,255,255,.3);}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#fff3c4);transition:width .25s;}
#loading .lbl{margin-top:10px;font-size:.85rem;letter-spacing:.5px;opacity:.9;}

/* ===== START ===== */
#startScreen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:40; opacity:0; pointer-events:none; transition:opacity .6s;}
#startScreen.show{opacity:1; pointer-events:all;}
.badge{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:#fff; padding:6px 18px; border-radius:20px; font-size:.75rem; letter-spacing:2px; margin-bottom:18px;}
.mainTitle{color:#fff; font-size:2.3rem; font-weight:800; text-shadow:0 3px 12px rgba(0,0,0,.6); text-align:center; max-width:80%;}
.subTitle{color:var(--gold); font-size:1.05rem; margin-top:10px; letter-spacing:1px; text-align:center;}
#startBtn{margin-top:34px; background:linear-gradient(135deg,var(--gold),#f0c94a); color:var(--navy); border:none; padding:16px 46px; font-size:1.15rem; font-weight:800; border-radius:40px; cursor:pointer; box-shadow:0 10px 30px rgba(212,175,55,.45); letter-spacing:1px;}
#startBtn:hover{transform:translateY(-2px) scale(1.03);}
#startBtn:active{transform:scale(.97);}
.bottomTitle{position:absolute; bottom:14px; left:0; right:0; text-align:center; color:rgba(255,255,255,.85); font-size:.7rem; letter-spacing:1.5px; font-weight:500;}

/* ===== MAIN ===== */
#mainApp{position:absolute; inset:0; z-index:20; display:none; flex-direction:column;}
#mainApp.show{display:flex;}
header{display:flex; align-items:center; justify-content:space-between; padding:10px 22px; background:var(--glass); backdrop-filter:blur(6px); border-bottom:2px solid var(--gold); color:#fff;}
header h1{font-size:1.05rem; font-weight:700;}
header .sub{font-size:.65rem; color:var(--gold); letter-spacing:1px;}
#resetBtn{background:rgba(193,39,45,.85); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:.75rem; font-weight:700; cursor:pointer;}
nav{display:flex; gap:6px; background:rgba(11,37,69,.85); padding:8px 16px;}
nav button{flex:1; background:rgba(255,255,255,.08); color:#dce6f5; border:1px solid rgba(255,255,255,.15); padding:9px 6px; border-radius:8px; font-size:.78rem; font-weight:700; cursor:pointer; transition:.2s;}
nav button.active{background:var(--gold); color:var(--navy); border-color:var(--gold);}
main{flex:1; overflow:hidden; position:relative; padding:14px 22px;}
.panel{position:absolute; inset:14px 22px; overflow-y:auto; display:none; color:#eef2f8; padding-right:8px;}
.panel.active{display:block;}
.panel::-webkit-scrollbar{width:7px;} .panel::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px;}
.card{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:14px 16px; margin-bottom:10px;}
.card h3{color:var(--gold); font-size:.95rem; margin-bottom:6px;}
.card p,.card li{font-size:.82rem; line-height:1.5; color:#dfe6f0;}
.card ul{padding-left:18px; margin-top:4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pill{display:inline-block; background:rgba(212,175,55,.2); color:var(--gold); border:1px solid var(--gold); padding:2px 10px; border-radius:20px; font-size:.68rem; margin-bottom:6px;}

/* accordion */
.acc-head{cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
.acc-body{max-height:0; overflow:hidden; transition:max-height .3s;}
.acc.open .acc-body{max-height:400px; margin-top:8px;}
.acc.open .arrow{transform:rotate(90deg);}
.arrow{transition:.3s; color:var(--gold);}

/* Simulasi */
.simWrap{display:flex; gap:14px; height:calc(100% - 6px);}
.simBox{flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-right:6px;}
.chip{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); padding:8px 10px; border-radius:8px; font-size:.78rem; cursor:grab; user-select:none;}
.chip.dragging{opacity:.4;}
.dropzone{flex:1; min-height:70px; border:2px dashed rgba(212,175,55,.6); border-radius:10px; padding:8px; font-size:.72rem; color:var(--gold); display:flex; flex-direction:column; gap:6px;}
.dropzone.over{background:rgba(212,175,55,.15);}
.dz-title{font-weight:800; font-size:.8rem; margin-bottom:2px;}
.result-chip{background:rgba(255,255,255,.9); color:var(--navy); padding:5px 8px; border-radius:6px; font-size:.72rem; font-weight:600;}
.result-chip.ok{border-left:4px solid var(--ok);}
.result-chip.bad{border-left:4px solid var(--bad);}

/* LKPD */
.qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.scoreBox{background:rgba(212,175,55,.2); border:1px solid var(--gold); padding:6px 14px; border-radius:20px; font-size:.78rem; color:var(--gold); font-weight:700;}
.qgroup-title{color:#fff; font-size:.85rem; font-weight:800; margin:14px 0 8px; border-bottom:1px solid rgba(255,255,255,.2); padding-bottom:4px;}
.q{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.q p.qt{font-size:.8rem; font-weight:600; margin-bottom:6px;}
.opt{display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; font-size:.76rem; cursor:pointer; margin-bottom:4px;}
.opt:hover{background:rgba(255,255,255,.08);}
.opt.correct{background:rgba(30,142,62,.35); color:#c8f7d4;}
.opt.wrong{background:rgba(193,39,45,.35); color:#ffd0d2;}
.tfBtns{display:flex; gap:8px;}
.tfBtns button{flex:1; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; font-size:.75rem; cursor:pointer; font-weight:700;}
.mc-drop{min-height:34px; border:1.5px dashed var(--gold); border-radius:6px; font-size:.72rem; color:var(--gold); padding:6px; margin-top:4px;}
.matchCol{display:flex; flex-direction:column; gap:6px;}
.mitem{background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.25); padding:6px 8px; border-radius:6px; font-size:.74rem; cursor:pointer;}
.mitem.sel{border-color:var(--gold); background:rgba(212,175,55,.25);}
.mitem.done{opacity:.5; cursor:default;}
.checkBtn{background:var(--gold); color:var(--navy); border:none; padding:9px 20px; border-radius:8px; font-weight:800; font-size:.8rem; cursor:pointer; margin-top:10px;}

footer.credit{font-size:.62rem; color:rgba(255,255,255,.5); text-align:center; padding:4px;}
::selection{background:var(--gold); color:var(--navy);}
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="lbl" id="loadLbl">Memuat aset laboratorium… 0%</div>
  </div>

  <div id="startScreen">
    <div class="badge">SMAK 2 PENABUR JAKARTA</div>
    <div class="mainTitle">Laboratorium Maya<br>Nilai &amp; Norma Sosial</div>
    <div class="subTitle">Fase F · Sosiologi · Unit PENABUR Jakarta</div>
    <button id="startBtn">▶ MULAI</button>
    <div class="bottomTitle">Lab Maya Interaktif — Nilai dan Norma Sosial • SMAK 2 PENABUR Jakarta</div>
  </div>

  <div id="mainApp">
    <header>
      <div><h1>Lab Maya: Nilai &amp; Norma Sosial</h1><div class="sub">SMAK 2 PENABUR JAKARTA · FASE F</div></div>
      <button id="resetBtn">⟲ Reset</button>
    </header>
    <nav id="tabs">
      <button data-tab="teori" class="active">📘 Teori</button>
      <button data-tab="prosedur">🧭 Prosedur</button>
      <button data-tab="simulasi">🧪 Simulasi</button>
      <button data-tab="lkpd">📝 LKPD</button>
      <button data-tab="pengembang">👩‍💻 Pengembang</button>
    </nav>
    <main>
      <div class="panel active" id="p-teori"></div>
      <div class="panel" id="p-prosedur"></div>
      <div class="panel" id="p-simulasi"></div>
      <div class="panel" id="p-lkpd"></div>
      <div class="panel" id="p-pengembang"></div>
    </main>
  </div>
</div>

<script>
/* ================= AUDIO (Web Audio, tanpa file eksternal) ================= */
let actx;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type='sine', vol=.18, delay=0){
  try{
    const c = ac(); const t0 = c.currentTime + delay;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
const S = {
  click: ()=> tone(520,.09,'square',.12),
  tab: ()=> tone(700,.08,'sine',.12),
  ok: ()=> { tone(600,.12,'sine',.15); tone(900,.16,'sine',.15,.09); },
  bad: ()=> tone(160,.22,'sawtooth',.15),
  whoosh: ()=> tone(300,.35,'sine',.1),
  drop: ()=> tone(440,.1,'triangle',.15)
};

/* ================= LOADING & START ================= */
let pct = 0;
const pfill = document.getElementById('pfill'), loadLbl = document.getElementById('loadLbl');
const timer = setInterval(()=>{
  pct += Math.random()*18+8;
  if(pct >= 100){ pct = 100; clearInterval(timer); finishLoad(); }
  pfill.style.width = pct+'%';
  loadLbl.textContent = 'Memuat aset laboratorium… '+Math.floor(pct)+'%';
}, 220);

function finishLoad(){
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('startScreen').classList.add('show');
    tone(500,.15,'sine',.1); tone(750,.2,'sine',.1,.12);
  }, 300);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  S.whoosh();
  document.getElementById('startScreen').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('startScreen').style.display='none';
    document.getElementById('mainApp').classList.add('show');
    buildAll();
  }, 350);
});

/* ================= TABS ================= */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  S.tab();
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+b.dataset.tab).classList.add('active');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  S.click();
  if(confirm('Reset seluruh progres Lab Maya (jawaban LKPD & Simulasi)?')){
    score = {correct:0,total:0};
    buildSimulasi(); buildLKPD();
    tone(300,.15,'sine',.12);
  }
});

/* ================= KONTEN TEORI ================= */
function acc(title, html){
  return `<div class="acc card">
    <div class="acc-head" onclick="this.parentElement.classList.toggle('open'); S.click();">
      <h3 style="margin:0">${title}</h3><span class="arrow">▶</span>
    </div>
    <div class="acc-body"><div style="font-size:.8rem;line-height:1.55;color:#dfe6f0;padding-top:4px">${html}</div></div>
  </div>`;
}
function buildTeori(){
  document.getElementById('p-teori').innerHTML = `
    <div class="pill">CP: Nilai, Norma, Sosialisasi, Keteraturan Sosial</div>
    ${acc('1. Hakikat Nilai dan Norma Sosial', `
      <b>Nilai sosial</b> adalah gagasan mengenai baik-buruk, benar-salah, pantas-tidak pantas yang dianut & disepakati bersama dalam masyarakat, menjadi acuan bertindak.<br><br>
      <b>Norma sosial</b> adalah aturan konkret berisi perintah/larangan yang mengikat perilaku anggota masyarakat, disertai sanksi bagi pelanggarnya. Norma adalah <i>penjabaran operasional</i> dari nilai.`)}
    ${acc('2. Fungsi Nilai dan Norma Sosial', `
      <ul><li>Pedoman berperilaku & bertindak dalam masyarakat</li>
      <li>Alat pengawas (kontrol sosial) dengan sanksi</li>
      <li>Menciptakan ketertiban & keteraturan sosial</li>
      <li>Sarana pengembangan diri & identitas sosial</li>
      <li>Menjaga solidaritas dan kesatuan kelompok</li></ul>`)}
    ${acc('3. Bentuk-bentuk Nilai Sosial', `
      <b>Menurut Notonagoro:</b> nilai material, nilai vital, nilai kerohanian (kebenaran, keindahan, moral, religius).<br>
      <b>Menurut sumbernya:</b> nilai dominan (dianut banyak orang) & nilai mendarah daging (internalized).`)}
    ${acc('4. Bentuk-bentuk Norma Sosial', `
      <b>Berdasarkan daya ikat:</b> cara (usage) → kebiasaan (folkways) → tata kelakuan (mores) → adat istiadat (custom) → hukum (laws) — dari sanksi paling ringan ke paling berat.<br><br>
      <b>Berdasarkan sumber/resminya:</b> norma agama, norma kesusilaan, norma kesopanan, norma hukum.`)}
    ${acc('5. Penerapan Nilai dan Norma dalam Kehidupan', `
      Diterapkan lewat proses <b>sosialisasi</b> (keluarga, sekolah, teman sebaya, media) sehingga nilai & norma terinternalisasi, menghasilkan <b>keteraturan sosial</b>. Pelanggaran terhadapnya disebut <b>perilaku menyimpang</b>, yang direspons lewat <b>pengendalian sosial</b> (preventif, represif, kuratif).`)}
  `;
}

/* ================= PROSEDUR ================= */
function buildProsedur(){
  document.getElementById('p-prosedur').innerHTML = `
    <div class="card"><h3>Tujuan Pembelajaran</h3><p>Menganalisis nilai dan norma sosial (hakikat, fungsi, bentuk, dan penerapan) melalui eksplorasi teori, simulasi interaktif, dan lembar kerja.</p></div>
    <div class="grid2">
      <div class="card"><h3>Langkah Pengerjaan</h3><ul>
        <li>Baca materi pada tab <b>Teori</b> secara menyeluruh.</li>
        <li>Buka tab <b>Simulasi</b>, klasifikasikan pernyataan ke kategori yang tepat (drag & drop).</li>
        <li>Kerjakan seluruh soal pada tab <b>LKPD</b>.</li>
        <li>Perhatikan skor yang tampil di pojok tab LKPD.</li>
        <li>Gunakan tombol <b>Reset</b> di kanan atas untuk mengulang.</li>
      </ul></div>
      <div class="card"><h3>Tata Tertib Lab Maya</h3><ul>
        <li>Kerjakan secara mandiri & jujur.</li>
        <li>Setiap jawaban langsung diberi umpan balik otomatis.</li>
        <li>Simulasi & LKPD dapat diulang tanpa batas.</li>
        <li>Gunakan mode layar penuh (F11) untuk pengalaman terbaik.</li>
      </ul></div>
    </div>
    <div class="card"><h3>Rubrik Penilaian Mandiri</h3><p>Skor otomatis = (jumlah benar / total soal) × 100. ≥85 Sangat Baik · 70–84 Baik · 55–69 Cukup · &lt;55 Perlu mengulang materi Teori.</p></div>
  `;
}

/* ================= SIMULASI (Drag & Drop Klasifikasi) ================= */
const simItems = [
  {t:'Membantu teman yang kesulitan', cat:'Nilai'},
  {t:'Dilarang mencuri barang orang lain', cat:'Norma'},
  {t:'Kejujuran dijunjung tinggi', cat:'Nilai'},
  {t:'Wajib memberi salam saat bertamu', cat:'Norma'},
  {t:'Keindahan alam patut dijaga', cat:'Nilai'},
  {t:'Pelanggar lalu lintas dikenai tilang', cat:'Norma'},
  {t:'Persatuan bangsa adalah hal berharga', cat:'Nilai'},
  {t:'Berpakaian sopan saat ke tempat ibadah', cat:'Norma'},
];
function buildSimulasi(){
  const shuffled = [...simItems].sort(()=>Math.random()-.5);
  document.getElementById('p-simulasi').innerHTML = `
    <div class="pill">Klasifikasikan pernyataan berikut ke kategori NILAI atau NORMA (seret / drag & drop)</div>
    <div class="simWrap">
      <div class="simBox" id="simSource" style="max-width:260px"></div>
      <div class="dropzone" id="dz-Nilai"><div class="dz-title">🟡 NILAI</div></div>
      <div class="dropzone" id="dz-Norma"><div class="dz-title">🔵 NORMA</div></div>
    </div>`;
  const src = document.getElementById('simSource');
  shuffled.forEach((it,i)=>{
    const c = document.createElement('div');
    c.className='chip'; c.draggable=true; c.textContent=it.t;
    c.dataset.cat = it.cat; c.id='sim'+i;
    c.addEventListener('dragstart', e=>{ c.classList.add('dragging'); e.dataTransfer.setData('id', c.id); });
    c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
    src.appendChild(c);
  });
  ['Nilai','Norma'].forEach(cat=>{
    const dz = document.getElementById('dz-'+cat);
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', ()=> dz.classList.remove('over'));
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.classList.remove('over');
      const id = e.dataTransfer.getData('id');
      const el = document.getElementById(id); if(!el) return;
      const ok = el.dataset.cat === cat;
      S.drop(); setTimeout(()=> ok?S.ok():S.bad(), 80);
      const r = document.createElement('div');
      r.className = 'result-chip ' + (ok?'ok':'bad');
      r.textContent = (ok?'✔ ':'✘ ') + el.textContent;
      dz.appendChild(r); el.remove();
    });
  });
}

/* ================= LKPD ================= */
let score = {correct:0, total:0};

const singleQ = [
 {q:'Nilai sosial yang berkaitan dengan kebutuhan fisik manusia disebut nilai…',o:['Material','Vital','Kerohanian','Dominan'],c:0},
 {q:'Aturan yang berisi perintah/larangan disertai sanksi disebut…',o:['Nilai','Peran','Norma','Status'],c:2},
 {q:'Norma dengan daya ikat paling lemah adalah…',o:['Hukum','Adat istiadat','Cara (usage)','Tata kelakuan'],c:2},
 {q:'Norma yang bersumber dari kitab suci disebut norma…',o:['Kesopanan','Kesusilaan','Agama','Hukum'],c:2},
 {q:'Fungsi utama nilai dan norma dalam masyarakat adalah…',o:['Menambah konflik','Pedoman berperilaku','Menghapus budaya','Membatasi kreativitas'],c:1},
 {q:'Proses penanaman nilai dan norma kepada individu disebut…',o:['Interaksi','Sosialisasi','Akulturasi','Asimilasi'],c:1},
];
const multiQ = [
 {q:'Manakah yang termasuk bentuk norma sosial? (pilih semua yang benar)',o:['Cara (usage)','Kebiasaan (folkways)','Nilai vital','Adat istiadat','Hukum'],c:[0,1,3,4]},
 {q:'Berikut ini termasuk fungsi nilai sosial:',o:['Pedoman bertindak','Alat kontrol sosial','Menciptakan keteraturan','Menghapus identitas','Sarana pengembangan diri'],c:[0,1,2,4]},
 {q:'Contoh norma kesopanan meliputi:',o:['Mengetuk pintu sebelum masuk','Membayar pajak','Berbicara sopan pada orang tua','Membunuh dilarang agama','Antre saat membeli tiket'],c:[0,2,4]},
 {q:'Sanksi sosial dapat berupa:',o:['Teguran','Pengucilan','Hadiah uang','Cemoohan','Penjara'],c:[0,1,3,4]},
 {q:'Nilai kerohanian menurut Notonagoro mencakup:',o:['Nilai kebenaran','Nilai keindahan','Nilai material','Nilai moral','Nilai religius'],c:[0,1,3,4]},
 {q:'Lembaga yang berperan dalam sosialisasi nilai & norma:',o:['Keluarga','Sekolah','Teman sebaya','Media massa','Cuaca'],c:[0,1,2,3]},
];
const tfQ = [
 {q:'Nilai sosial bersifat abstrak, sedangkan norma sosial bersifat konkret.',c:true},
 {q:'Norma hukum memiliki daya ikat paling lemah dibanding norma lain.',c:false},
 {q:'Setiap pelanggaran norma pasti dikenai sanksi hukum pidana.',c:false},
 {q:'Nilai dominan adalah nilai yang dianut oleh sebagian besar anggota masyarakat.',c:true},
 {q:'Sosialisasi adalah proses penanaman nilai dan norma kepada individu.',c:true},
 {q:'Perilaku menyimpang tidak berkaitan dengan pelanggaran nilai dan norma.',c:false},
];
const ddQ = [
 {t:'Memberi salam saat bertemu guru', cat:'Norma Kesopanan'},
 {t:'Tidak boleh berzina menurut ajaran agama', cat:'Norma Agama'},
 {t:'Dilarang mencuri, diancam pidana', cat:'Norma Hukum'},
 {t:'Malu jika berbohong kepada orang tua', cat:'Norma Kesusilaan'},
 {t:'Berpakaian rapi saat menghadiri pesta adat', cat:'Norma Kesopanan'},
 {t:'Wajib menikah sesuai syariat agama', cat:'Norma Agama'},
];
const matchQ = [
 {l:'Usage (cara)', r:'Daya ikat paling lemah, sanksi ringan (celaan)'},
 {l:'Folkways (kebiasaan)', r:'Perbuatan berulang yang dianggap baik'},
 {l:'Mores (tata kelakuan)', r:'Mencerminkan sifat hidup kelompok, sanksi lebih tegas'},
 {l:'Custom (adat istiadat)', r:'Tata kelakuan kekal, sanksi keras dari leluhur'},
 {l:'Laws (hukum)', r:'Tertulis, dibuat lembaga resmi, sanksi tegas'},
 {l:'Nilai vital', r:'Berguna bagi manusia untuk beraktivitas'},
];

function markScore(el, ok){
  score.total++; if(ok) score.correct++;
  el.classList.add(ok?'correct':'wrong');
  ok?S.ok():S.bad();
  updateScoreBox();
}
function updateScoreBox(){
  const b = document.getElementById('scoreBox');
  if(b) b.textContent = 'Skor: '+score.correct+' / '+score.total;
}

function buildLKPD(){
  score = {correct:0,total:0};
  let h = `<div class="qmeta"><div class="pill">LKPD — 30 Soal (5 Jenis)</div><div class="scoreBox" id="scoreBox">Skor: 0 / 0</div></div>`;

  h += `<div class="qgroup-title">A. Pilihan Tunggal (Single Choice)</div>`;
  singleQ.forEach((it,i)=>{
    h += `<div class="q"><p class="qt">${i+1}. ${it.q}</p>` +
      it.o.map((op,j)=>`<div class="opt" onclick="answerSingle(this,${i},${j})">${String.fromCharCode(65+j)}. ${op}</div>`).join('') +
      `</div>`;
  });

  h += `<div class="qgroup-title">B. Pilihan Ganda / Multi-Jawaban (Multiple Choice)</div>`;
  multiQ.forEach((it,i)=>{
    h += `<div class="q" id="mq${i}"><p class="qt">${i+1}. ${it.q} <i>(boleh lebih dari satu)</i></p>` +
      it.o.map((op,j)=>`<label class="opt"><input type="checkbox" id="mq${i}o${j}" style="margin-right:4px">${op}</label>`).join('') +
      `<button class="checkBtn" onclick="answerMulti(${i})">Periksa Jawaban</button></div>`;
  });

  h += `<div class="qgroup-title">C. Benar / Salah</div>`;
  tfQ.forEach((it,i)=>{
    h += `<div class="q" id="tq${i}"><p class="qt">${i+1}. ${it.q}</p>
      <div class="tfBtns"><button onclick="answerTF(${i},true)">✔ Benar</button><button onclick="answerTF(${i},false)">✘ Salah</button></div></div>`;
  });

  h += `<div class="qgroup-title">D. Drag &amp; Drop (Klasifikasi Jenis Norma)</div>`;
  ddQ.forEach((it,i)=>{
    const cats = ['Norma Agama','Norma Kesusilaan','Norma Kesopanan','Norma Hukum'].sort(()=>Math.random()-.5);
    h += `<div class="q"><p class="qt">${i+1}. "${it.t}"</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">` +
      cats.map(c=>`<div class="chip" style="cursor:pointer" onclick="answerDD(this,${i},'${c}')">${c}</div>`).join('') +
      `<div class="mc-drop" id="ddres${i}" style="flex-basis:100%">Klik salah satu kategori di atas</div></div></div>`;
  });

  h += `<div class="qgroup-title">E. Menjodohkan (Matching)</div>
    <div class="q"><p class="qt">Klik istilah di kiri, lalu klik pasangan definisi yang tepat di kanan.</p>
    <div class="grid2"><div class="matchCol" id="matchL"></div><div class="matchCol" id="matchR"></div></div>
    <div class="mc-drop" id="matchStatus" style="margin-top:8px">0 / ${matchQ.length} pasangan benar</div></div>`;

  document.getElementById('p-lkpd').innerHTML = h;

  const L = document.getElementById('matchL'), R = document.getElementById('matchR');
  const rItems = [...matchQ].sort(()=>Math.random()-.5);
  matchQ.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='mitem'; d.textContent=it.l; d.dataset.key=it.l; d.onclick=()=>selMatch(d,'L');
    L.appendChild(d);
  });
  rItems.forEach(it=>{
    const d=document.createElement('div'); d.className='mitem'; d.textContent=it.r; d.dataset.key=it.l; d.onclick=()=>selMatch(d,'R');
    R.appendChild(d);
  });
}
let matchSel = {L:null,R:null}; let matchCorrectCount=0;
function selMatch(el,side){
  if(el.classList.contains('done')) return;
  S.click();
  document.querySelectorAll('.matchCol .mitem').forEach(x=>{ if(!x.classList.contains('done')) x.classList.remove('sel'); });
  matchSel[side]=el; el.classList.add('sel');
  if(matchSel.L && matchSel.R){
    const ok = matchSel.L.dataset.key === matchSel.R.dataset.key;
    if(ok){
      matchSel.L.classList.add('done'); matchSel.R.classList.add('done');
      matchSel.L.classList.remove('sel'); matchSel.R.classList.remove('sel');
      matchCorrectCount++; S.ok(); score.total++; score.correct++;
    } else {
      S.bad(); score.total++;
      const l=matchSel.L, r=matchSel.R;
      l.style.background='rgba(193,39,45,.35)'; r.style.background='rgba(193,39,45,.35)';
      setTimeout(()=>{ l.style.background=''; r.style.background=''; l.classList.remove('sel'); r.classList.remove('sel'); },500);
    }
    document.getElementById('matchStatus').textContent = matchCorrectCount+' / '+matchQ.length+' pasangan benar';
    matchSel={L:null,R:null}; updateScoreBox();
  }
}
function answerSingle(el,i,j){
  const box = el.parentElement;
  if(box.dataset.done) return; box.dataset.done=1;
  box.querySelectorAll('.opt').forEach((o,idx)=> idx===singleQ[i].c ? o.classList.add('correct') : (idx===j?o.classList.add('wrong'):null));
  score.total++; if(j===singleQ[i].c) score.correct++;
  (j===singleQ[i].c)?S.ok():S.bad(); updateScoreBox();
}
function answerMulti(i){
  const box = document.getElementById('mq'+i);
  if(box.dataset.done) return; box.dataset.done=1;
  let picked=[]; multiQ[i].o.forEach((op,j)=>{ if(document.getElementById('mq'+i+'o'+j).checked) picked.push(j); });
  const correct = JSON.stringify(picked.sort())===JSON.stringify([...multiQ[i].c].sort());
  multiQ[i].o.forEach((op,j)=>{
    const lab = document.getElementById('mq'+i+'o'+j).parentElement;
    if(multiQ[i].c.includes(j)) lab.classList.add('correct');
    else if(picked.includes(j)) lab.classList.add('wrong');
  });
  score.total++; if(correct) score.correct++;
  correct?S.ok():S.bad(); updateScoreBox();
}
function answerTF(i,val){
  const box = document.getElementById('tq'+i);
  if(box.dataset.done) return; box.dataset.done=1;
  const ok = val===tfQ[i].c;
  box.style.borderLeft = '4px solid ' + (ok?'#1e8e3e':'#c1272d');
  score.total++; if(ok) score.correct++;
  ok?S.ok():S.bad(); updateScoreBox();
}
function answerDD(el,i,cat){
  const box = el.closest('.q');
  if(box.dataset.done) return; box.dataset.done=1;
  const ok = cat===ddQ[i].cat;
  document.getElementById('ddres'+i).textContent = ok ? ('✔ Benar: '+cat) : ('✘ Salah. Jawaban tepat: '+ddQ[i].cat);
  score.total++; if(ok) score.correct++;
  S.drop(); setTimeout(()=> ok?S.ok():S.bad(),80); updateScoreBox();
}
